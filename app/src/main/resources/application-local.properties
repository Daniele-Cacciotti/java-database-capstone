# Local profile: start Spring Boot with the local profile enabled.
# Credentials come from the .env values exported by your terminal.
spring.datasource.url=jdbc:mysql://127.0.0.1:3307/cms?sslMode=DISABLED&allowPublicKeyRetrieval=true
spring.datasource.username=cmsapp
spring.datasource.password=${MYSQL_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never
spring.data.mongodb.uri=mongodb://cmsadmin:${MONGO_ROOT_PASSWORD}@127.0.0.1:27017/prescriptions?authSource=admin
jwt.secret=${JWT_SECRET}
