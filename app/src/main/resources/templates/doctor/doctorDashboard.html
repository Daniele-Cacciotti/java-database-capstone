<!-- doctorDashboard.html -->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoctorDashboard</title>

    <link rel="icon" type="image/png"
          th:href="@{/assets/images/logo/logo.png}">

    <link rel="stylesheet" th:href="@{/assets/css/adminDashboard.css}">
    <link rel="stylesheet" th:href="@{/assets/css/doctorDashboard.css}">
    <link rel="stylesheet" th:href="@{/assets/css/style.css}">

    <script th:src="@{/js/util.js}" defer></script>
    <script th:src="@{/js/render.js}" defer></script>
    <script type="module" th:src="@{/js/components/header.js}"></script>
    <script th:src="@{/js/components/footer.js}" defer></script>

    <script type="module"
            th:src="@{/js/components/patientRows.js}"></script>
    <script type="module"
            th:src="@{/js/services/patientServices.js}"></script>
    <script type="module"
            th:src="@{/js/doctorDashboard.js}"></script>
</head>
<body onload="renderContent()">
    <div class="container">
        <div class="wrapper">
            <div id="header"></div>

            <main class="main-content">
                <input
                    type="text"
                    id="searchBar"
                    class="searchBar"
                    placeholder="Search by patient name"
                    aria-label="Search by patient name">

                <div class="filter-wrapper">
                    <button
                        type="button"
                        id="todayButton"
                        class="today-btn">
                        Today's Appointments
                    </button>

                    <input
                        type="date"
                        id="datePicker"
                        class="date-picker"
                        aria-label="Appointment date">
                </div>

                <table id="patientTable">
                    <thead>
                        <tr>
                            <th scope="col">Patient ID</th>
                            <th scope="col">Name</th>
                            <th scope="col">Phone</th>
                            <th scope="col">Email</th>
                            <th scope="col">Prescription</th>
                        </tr>
                    </thead>
                    <tbody id="patientTableBody"></tbody>
                </table>
            </main>

            <div id="footer"></div>
        </div>
    </div>
</body>
</html>
